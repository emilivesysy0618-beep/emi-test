<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>これまでの記録 | 今日の直感ノート</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main>
      <header>
        <p class="mark">✦</p>
        <h1>これまでの記録</h1>
        <p class="intro">これまでに書き留めた言葉を、ゆっくり振り返るためのページです。</p>
        <a class="history-link" href="index.html">今日のお題に戻る</a>
      </header>
      <section class="account" aria-label="アカウント">
        <p id="auth-status" class="auth-status" aria-live="polite">ログイン状態を確認しています。</p>
        <button id="sign-in" class="auth-button" type="button">Googleでログイン</button>
        <button id="sign-out" class="text-button" type="button" hidden>ログアウト</button>
      </section>
      <p id="history-status" class="history-status" aria-live="polite">記録を読み込んでいます。</p>
      <section id="history-list" class="history-list" aria-label="保存済みの記録"></section>
    </main>
    <script type="module" src="history.js?v=ipad-login-fix"></script>
  </body>
</html>
